<app-page-header [header]="'Favorites'" [breadcrumbs]="[
    {label: 'Domains',      url: '/'},
    {label: 'Favorites', url: ''}
]"></app-page-header>

<div class="block block-empty" *ngIf="!(favorites.items$|async)?.length">
    <div class="container">
        <div class="block-empty__body">
            <div class="block-empty__message">You currently have not added any products to your favorites!</div>
            <div class="block-empty__actions">
                <a routerLink="/" class="btn btn-primary btn-sm">Continue</a>
            </div>
        </div>
    </div>
</div>

<div class="block" *ngIf="(favorites.items$|async)?.length">
    <div class="container-fluid">
        <table class="wishlist">
            <thead class="wishlist__head">
            <tr class="wishlist__row">
                <th class="wishlist__column wishlist__column--image">Image</th>
                <th class="wishlist__column wishlist__column--product">Product</th>
                <th class="wishlist__column wishlist__column--stock">Datatype</th>
                <!--<th class="wishlist__column wishlist__column--stock">Type</th>-->
                <th class="wishlist__column wishlist__column--stock"></th>
                <!--<th class="wishlist__column wishlist__column--stock">Data Steward</th>
                <th class="wishlist__column wishlist__column--stock">Point of Contact</th>-->
                <th class="wishlist__column wishlist__column--tocart">Action</th>
                <th class="wishlist__column wishlist__column--remove">Remove</th>
            </tr>
            </thead>
            <tbody class="wishlist__body">
            <tr *ngFor="let product of favorites.items$|async" class="wishlist__row">
                <td class="wishlist__column wishlist__column--image">
                    <div class="product-image">
                        <a *ngIf="product.images?.length" [routerLink]="root.product(product)" class="product-image__body">
                            <img class="product-image__img" [src]="product.images[0]" alt="">
                        </a>
                    </div>
                </td>

                <td class="wishlist__column wishlist__column--product">
                    <a [href]="root.product(product)" class="wishlist__product-name"><small>{{ product.name }}</small></a>
                    <div class="wishlist__product-rating">
                        <div class="wishlist__product-rating-legend" style="margin-left: 0px; color: #222"><small><span style="font-weight: 700;">Classification: </span>{{ product.classification }}</small></div>
                    </div>
                </td>

                <td class="wishlist__column wishlist__column--stock"><small>{{ product.datatype }}</small></td>
                <!--<td class="wishlist__column wishlist__column--stock"><small>{{ product.platformType }}</small></td>-->
                <td class="wishlist__column wishlist__column--stock text-danger"><small><strong>{{ product.org.name }}</strong></small></td>
                <!--<td class="wishlist__column wishlist__column--stock"><small>{{ product.dataSteward }}</small></td>
                <td class="wishlist__column wishlist__column--stock"><small>{{ product.pocName }}</small></td>-->
                <!--<td class="wishlist__column wishlist__column--price">{{ product.price|currencyFormat }}</td>-->
                <td class="wishlist__column wishlist__column--tocart">
                    <button type="button" class="btn btn-primary btn-sm" (click)="addToCart(product)" [ngClass]="{'btn-loading': addedToCartProducts.includes(product)}">Add To Cart</button>
                </td>
                <td class="wishlist__column wishlist__column--image">
                    <button type="button" class="btn btn-light btn-sm btn-svg-icon" (click)="remove(product)" [ngClass]="{'btn-loading': removedProducts.includes(product)}">
                        <app-icon name="cross-12" size="12"></app-icon>
                    </button>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
