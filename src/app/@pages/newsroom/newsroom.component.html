<div class="newsroom-layout container">
  <main class="news-list">
    <div *ngIf="posts.length === 0" class="empty">
      <p>No posts found.</p>
    </div>

    <article *ngFor="let post of posts" class="news-item">
      <a [routerLink]="getDetailsRoute(post)">
        <div class="thumb" [style.background-image]="'url(' + post.image + ')'"></div>
        <div class="body">
          <h3>{{ post.title }}</h3>
          <p class="summary" [innerHTML]="post.summary"></p>
          <div class="meta">
            <span class="author">{{ post.author }}</span>
            <span class="dot">•</span>
            <span class="date">{{ post.date }}</span>
            <span class="category">{{ post.category }}</span>
          </div>
        </div>
      </a>
    </article>
  </main>
</div>
