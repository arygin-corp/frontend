  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script>
    let scene, camera, renderer, orbCore, orbGlow, clock = new THREE.Clock();

    init();
    animate();

    function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
      camera.position.z = 3;

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(devicePixelRatio);
      document.body.appendChild(renderer.domElement);

      const geometry = new THREE.SphereGeometry(1, 128, 128);

      // Core orb
      const coreMat = new THREE.ShaderMaterial({
        uniforms: {
          uTime:  { value: 0 },
          uScale: { value: 1 }
        },
        vertexShader: `
          uniform float uTime, uScale;
          varying vec3 vPos;
          void main() {
            vPos = position;
            float wave = sin(position.x*5. + uTime*3.)*0.02
                       + sin(position.y*6. + uTime*4.)*0.02
                       + sin(position.z*7. + uTime*2.5)*0.02;
            vec3 pos = position * (1.0 + wave * uScale);
            gl_Position = projectionMatrix * modelViewMatrix * vec4(pos,1.);
          }
        `,
        fragmentShader: `
          uniform float uTime;
          varying vec3 vPos;
          void main() {
            vec3 darkPurple = vec3(0.4, 0.1, 0.6);
            vec3 brightPurple = vec3(0.4, 0.3, 0.9);
            float t = sin(vPos.x*2. + uTime*2.) * 0.5 + 0.5;
            vec3 color = mix(darkPurple, brightPurple, t);
            gl_FragColor = vec4(color, 1.0);
          }
        `,
        transparent: false
      });
      orbCore = new THREE.Mesh(geometry, coreMat);
      orbCore.scale.set(0.7, 0.7, 0.7);               // ← scaled down to 70%
      scene.add(orbCore);

      // Glow layer
      const glowMat = new THREE.ShaderMaterial({
        uniforms: {
          uTime:      { value: 0 },
          uScale:     { value: 1 },
          uIntensity: { value: 1.2 }
        },
        vertexShader: coreMat.vertexShader,
        fragmentShader: `
          uniform float uTime, uIntensity;
          varying vec3 vPos;
          void main() {
            float rim = pow(1.0 - abs(dot(normalize(vPos), vec3(0,0,1))), 2.5);
            vec3 glowBase = vec3(0.3, 0.2, 0.8);
            vec3 glow = glowBase * rim * uIntensity;
            gl_FragColor = vec4(glow, rim * 0.7);
          }
        `,
        blending: THREE.AdditiveBlending,
        transparent: true,
        depthWrite: false
      });
      orbGlow = new THREE.Mesh(geometry, glowMat);
      orbGlow.scale.set(0.7 * 1.1, 0.7 * 1.1, 0.7 * 1.1); // ← glow scales with core
      scene.add(orbGlow);

      const pl = new THREE.PointLight(0xffffff, 1.0);
      pl.position.set(0, 0, 2);
      scene.add(pl);

      window.addEventListener('resize', () => {
        camera.aspect = innerWidth/innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });
    }

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      const base    = Math.sin(t*8)  * 0.15 + 0.85;
      const detail  = Math.sin(t*16) * 0.05;
      const activity = base + detail;

      orbCore.material.uniforms.uTime.value       =
      orbGlow.material.uniforms.uTime.value      = t * 1.5;
      orbCore.material.uniforms.uScale.value     =
      orbGlow.material.uniforms.uScale.value     = activity;
      orbGlow.material.uniforms.uIntensity.value  = activity * 1.2;

      orbCore.rotation.y = orbGlow.rotation.y = t * 0.2;
      orbCore.rotation.z = orbGlow.rotation.z = t * 0.1;

      renderer.render(scene, camera);
    }
  </script>
