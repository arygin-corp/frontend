<div class="tailwind-scope">
	<div id="ai-assistant" class="chat-style fixed bottom-4 right-4 w-96 bg-white rounded-2xl shadow-2xl z-50 border" *ngIf="isChatOpen" (click)="$event.stopPropagation()">
		<div class="bg-gradient-to-r from-blue-600 to-blue-800 text-white p-4 rounded-t-2xl flex justify-between items-center">
			<div class="flex items-center space-x-2">
				<div class="w-10 h-10 flex items-center justify-center">
					<app-ai-brain></app-ai-brain>
				</div>
				<div>
					<div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">
						<h3 class="font-bold" style="margin: 0;">VIKKI AI</h3>
						<span class="bot-status" style="display: flex; align-items: center; gap: 4px; font-size: 12px; color: #10b981;">
							<div class="status-indicator" style="width: 8px; height: 8px; background-color: #10b981; border-radius: 50%;"></div>
							<span>Online</span>
						</span>
					</div>
					<p style="font-size: 14px; font-weight: 400; margin: 0;">Virtual Intuitive, Knowledgeable, & Kinetic Intelligence</p>
				</div>
			</div>
			<button *ngIf="isChatOpen" (click)="closeChat()" class="text-white/80 hover:text-white ml-4">
				<i class="fas fa-times text-xl"></i>
			</button>
		</div>

		<div id="ai-messages" class="h-80 overflow-y-auto p-4 space-y-3 bg-gray-50" #messagesContainer>
			<ng-container *ngIf="messages.length === 0">
				<div class="flex gap-2">
					<div class="w-8 h-8 flex items-center justify-center flex-shrink-0">
						<app-ai-brain></app-ai-brain>
					</div>
					<div class="bg-white p-3 rounded-lg rounded-tl-none shadow-sm max-w-[80%]">
						<p class="text-gray-800">Hello, I'm VIKKI, your virtual AI Assistant. How can I help you?</p>
					</div>
				</div>
			</ng-container>

			<ng-container *ngFor="let msg of messages">
				<div *ngIf="msg.sender === 'user'" class="flex gap-2 justify-end">
					<div class="bg-blue-600 text-white p-3 rounded-lg rounded-tr-none shadow-sm max-w-[80%] break-words">
						<p class="text-sm">{{ msg.text }}</p>
					</div>
				</div>

				<div *ngIf="msg.sender === 'ai'" class="flex gap-2">
					<div class="w-8 h-8 flex items-center justify-center flex-shrink-0 mt-1">
						<app-ai-brain></app-ai-brain>
					</div>
					<div class="bg-white p-3 rounded-lg rounded-tl-none shadow-sm max-w-[80%]">
						<p class="text-gray-800 text-sm break-words" [innerHTML]="msg.text"></p>
						<div *ngIf="msg.sources && msg.sources.length > 0" class="mt-2 pt-2 border-t border-gray-200 text-xs">
							<strong class="text-gray-600">Sources:</strong>
							<div class="flex gap-1 flex-wrap mt-1">
								<button *ngFor="let source of msg.sources" 
									(click)="openSource(source)"
									class="px-2 py-1 bg-blue-100 text-blue-600 rounded hover:bg-blue-200 transition">
									{{ source }}
								</button>
							</div>
						</div>
					</div>
				</div>
			</ng-container>

			<div *ngIf="isThinking" class="flex gap-2">
				<div class="w-8 h-8 flex items-center justify-center flex-shrink-0">
					<app-ai-brain></app-ai-brain>
				</div>
				<div class="bg-white p-3 rounded-lg rounded-tl-none shadow-sm">
					<div class="flex gap-1 items-center">
						<span class="w-2 h-2 bg-gray-400 rounded-full animate-bounce"></span>
						<span class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.2s;"></span>
						<span class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.4s;"></span>
					</div>
				</div>
			</div>
		</div>

		<div class="p-4 bg-white border-t rounded-b-2xl">
			<div class="flex gap-2">
				<input type="text" #inputField placeholder="Ask me anything..." 
					class="flex-1 px-4 py-2 border rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500"
					(keydown)="handleKeyDown($event, inputField)"
					[disabled]="isProcessing">
				<button (click)="sendMessage(inputField)" class="w-10 h-1 rounded-full flex items-center justify-center transition disabled:opacity-50"
					[disabled]="isProcessing" style="background-color: #363636;">
					<i class="fas fa-paper-plane" style="color: #04fdff;"></i>
				</button>
			</div>
		</div>
	</div>

	<button class="ask-ai-button" [class.chat-open]="isChatOpen" (click)="toggleChat()" 
		[attr.aria-label]="isChatOpen ? 'Close chat' : 'Open chat'">
		<span class="button-icon">
			<img class="icon-ai" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADIAAAAyCAYAAAAeP4ixAAAACXBIWXMAAAsTAAALEwEAmpwYAAACVElEQVR4nOWazUocQRSFv0Y0MknIg+QBMgM+wDjBhWZnQp7FB8gMuNTs1KWuBF1FH8QsYoSAJjgS/F2NlNyBoumfmu7b3d7xQNHzU3OrTvepqlunBl4oIuBYinttFh1gJKWNYQw8In2MIgJ+eUR+W5VXxyNhWl6DBCJ967IaWZVXJ4GEKXlF0tHDDCKHUudZPpn3wBpwkkEgSWbrwEKTpCK5q27wnk7Q+bRyKrFCnlQP+CvX0jhW6HxaOcpp+0DquatZIu+AB6nnru59I+Oi7Hj5EvvdZw0iTQz2vViMXQxOvy3gJhbrRj6vDO0MIh8KxvyUEm8FYynKTgqRbSpGP6HRbwVjzQKXKUSugDlqlldRWfVyJo5FjGysvucQ2aRGefVLyOo8h8i51KtFXpPIakbWF7fO/Alcl/4BW8AS8EqbSCQpx1GArFoylbpZaFgyUxhKnJWq1xm/80tyJ/8rpDqjhHIL7ANftXIzHx8lex0ngHWVB2lXZQvgcFEzgVGsuPZV0JuWJzI1YyQJ8x6psrPWtdf5N5Rw30Om2yy43KkrK3boeLqQ+l2N3KtdgX/VyMo+qMge3cwhsqHY1pOUfGvoTNGvWswh0sWI+561Hxlq70eqdt+3U4hsaQSP5EkMZKcWb+RKvusoyGw5hciyhv3zc4K5/ayk19uS9SHuorxu0mXMs0VDfa29oiSaJrIai7OK0WOEt8CdxLvXzJ3844W0wR56XBAKVTc+1Meq4vBzfD5SmQWk6WM1imha/iAQl1dRe/RZoG1dVmM4Kf2QYlZWWMIjBRCCjNetQQAAAAAASUVORK5CYII=" alt="AI Icon">
			<svg class="icon-close" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
				<path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
			</svg>
		</span>
		<span class="button-text">Ask VIKKI</span>
	</button>
</div>
